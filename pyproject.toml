[project]
name = "floodmap"
version = "0.1.0"
description = "Mapping Flood Damage from Space - Multimodal AI Hackathon 2026 (Track B)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Agent", email = "agent@antigravity.ai" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pystac>=1.10.0",
    "pystac-client>=0.8.0",
    "requests>=2.31.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]
full = [
    "xarray>=2024.1.0",
    "rioxarray>=0.15.0",
    "geopandas>=0.14.0",
    "pyflwdir>=0.5.8",
    "networkx>=3.2.0",
    "jinja2>=3.1.3",
    "streamlit>=1.32.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
